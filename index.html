<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R2 order status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--ink:#f2f2f2;--soft:#c9c9c9;--muted:#8a8a8a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:3vmin 5vmin;overflow:hidden}
#car{flex:0 1 auto;min-height:0;max-width:80%;max-height:46%;object-fit:contain}
.raw{margin-top:1.5vmin;font-size:max(1.9vmin,11px);color:var(--muted);line-height:1.5}
h1{margin-top:3vmin;font-size:clamp(22px,6vmin,64px);font-weight:600;letter-spacing:-.01em}
.line{max-width:90%;margin-top:1.4vmin;font-size:max(3vmin,14px);color:var(--soft)}
.small{font-size:max(2.3vmin,12px);color:var(--muted)}
.eta{color:var(--ink)}
.line:empty,.raw:empty{display:none}
</style>
</head>
<body>
<img id="car" src="car.jpg" alt="Rivian R2">
<div class="raw" id="raw"></div>
<h1 id="headline">Loading…</h1>
<p class="line" id="config"></p>
<p class="line small" id="reserved"></p>
<p class="line eta" id="eta"></p>
<p class="line small" id="note"></p>
<p class="line small" id="updated"></p>
<script>
const HEADLINES={
  ordered:"Your R2 order is in",
  confirmed:"Your R2 order is confirmed",
  production:"Your R2 is in production",
  shipped:"Your R2 is on its way",
  scheduled:"Your R2 delivery is scheduled",
  delivered:"Your R2 has been delivered"
};
const $=id=>document.getElementById(id);
const car=$("car");
car.onerror=()=>{const h=document.createElement("p");h.className="raw";h.textContent="Image not found: car.jpg must be in the same folder as index.html";car.replaceWith(h)};
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(s){
  $("headline").textContent=HEADLINES[s.stage]||"Your R2 order";
  $("config").textContent=s.config||"";
  $("reserved").textContent=s.reserved?"Reserved "+s.reserved:"";
  const nice=v=>{const t=String(v).replace(/_/g," ").toLowerCase();return esc(t.charAt(0).toUpperCase()+t.slice(1))};
  const raw=[];
  if(s.state)raw.push("Order status: "+nice(s.state));
  if(s.fulfillment)raw.push("Fulfillment: "+nice(s.fulfillment));
  if(s.config_status)raw.push("Configuration: "+nice(s.config_status));
  $("raw").innerHTML=raw.map(t=>"<div>"+t+"</div>").join("");
  let eta="";
  if(s.eta_date){
    const d0=new Date(s.eta_date+"T00:00:00"),d=Math.ceil((d0-new Date())/864e5);
    const when=d0.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
    eta=d>0?`Estimated delivery ${when} · ${d} day${d===1?"":"s"} to go`:`Estimated delivery ${when}`;
  }else if(s.eta){eta="Estimated delivery "+s.eta}
  $("eta").textContent=eta;
  $("note").textContent=s.note||"";
  $("updated").textContent=s.updated?"Status changed "+s.updated:"";
}
async function load(){
  try{
    const r=await fetch("status.json?t="+Date.now());
    if(!r.ok)throw new Error(r.status);
    render(await r.json());
  }catch(e){
    $("headline").textContent="Status unavailable";
    $("note").textContent="Check that status.json is in the repo and valid JSON.";
  }
}
load();setInterval(load,10*60*1000);
</script>
</body>
</html>
