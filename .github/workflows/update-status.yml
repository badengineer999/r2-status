name: Update order status

on:
  workflow_dispatch:
  # Uncomment once scripts/fetch_status.py is working:
  # schedule:
  #   - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_status.py
      - name: Commit if changed
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || (git commit -m "Update order status" && git push)
