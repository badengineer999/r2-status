name: Update order status

on:
  workflow_dispatch:
  # Uncomment after one manual run succeeds:
  # schedule:
  #   - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      - name: Fetch order status
        env:
          RIVIAN_APP_SESSION_TOKEN: ${{ secrets.RIVIAN_APP_SESSION_TOKEN }}
          RIVIAN_CSRF_TOKEN: ${{ secrets.RIVIAN_CSRF_TOKEN }}
          RIVIAN_USER_SESSION_TOKEN: ${{ secrets.RIVIAN_USER_SESSION_TOKEN }}
        run: python scripts/fetch_status.py
      - name: Commit if changed
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || (git commit -m "Update order status" && git push)
